[package]
name = "angular-analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
swc_common = { version = "0.31", features = ["sourcemap"] }
swc_ecma_ast = "0.106"
swc_ecma_parser = "0.136"
lightningcss = "1.0.0-alpha.57"
scraper = "0.17"
serde = { version = "=1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.3", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
