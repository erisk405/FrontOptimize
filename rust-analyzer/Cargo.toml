[package]
name = "angular-analyzer"
version = "0.1.0"
edition = "2021"

[dependencies]
swc_common = "0.33"
swc_ecma_ast = "0.112"
swc_ecma_parser = "0.143"
lightningcss = "1.0.0-alpha.68"
scraper = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
